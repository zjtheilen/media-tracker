<! DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
            background: #f7f7f7;
        }

        h1, h2 {
            text-align: center;
        }

        form {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 20px 10px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }

        input, select, textarea {
            width: 100%;
            margin: 8px 0;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

        #score-container div {
            margin: 10px 0;
        }

        #entries-container div {
            background: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            box-shadow: 0 10px 5px rgba(0,0,0,0.08);
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #333;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #555;
        }
    </style>
    <title>Media Tracker</title>
</head>

<body>

    <h1>Media Tracker</h1>
    <p>Welcome to the Media Tracker!</p>

    <h2>Add Entry</h2>

    <form id="entry-form">
        <input type="text" id="title" placeholder="Title" required>

        <select id="media-type">
            <option value="video">video</option>
            <option value="game">game</option>
            <option value="book">book</option>
        </select>

        <input type="text" id="genre" placeholder="Genre">

        <textarea id="notes" placeholder="Notes"></textarea>

        <div id="score-container"></div>

        <button type="submit">Add Entry</button>
    </form>

    <h2>Entries</h2>

    <div id="entries-container"></div>

    <script>
        const form = document.getElementById('entry-form');

        const scoringProfiles = {
            video: [
                "Writing",
                "Acting",
                "Cinematography",
                "Sound",
                "Pacing",
                "Originality",
                "Engagement",
                "Thought Provoking"
            ],
            book: [
                "Writing",
                "Pacing",
                "Originality",
                "Engagement",
                "Thought Provoking",
                "Setting",
                "Emotional Impact",
                "Curiosity"
            ],
            game: [
                "Gameplay",
                "Sound",
                "Story",
                "Creativity",
                "Emotional Impact",
                "Thought Provoking",
                "Replayability",
                "Art"
            ]
        };

        const mediaTypeSelect = document.getElementById('media-type');
        const scoreContainer = document.getElementById('score-container');

        function renderScoreInputs(mediaType) {
            scoreContainer.innerHTML = "";

            const categories = scoringProfiles[mediaType];

            categories.forEach(category => {
                const wrapper = document.createElement('div');

                wrapper.innerHTML = `
                    <label>
                        ${category}:
                        <span id="11${category}-value">3</span>
                    </label>

                    <input type="range" min="1" max="5" value="3" id="${category}">
                `;

                scoreContainer.appendChild(wrapper);

                const slider = document.getElementById(category);
                const valueDisplay = document.getElementById(`11${category}-value`);

                slider.addEventListener('input', () => {
                    valueDisplay.textContent = slider.value;
                });
            });
        }

        renderScoreInputs(mediaTypeSelect.value);

        mediaTypeSelect.addEventListener('change', () => {
            renderScoreInputs(mediaTypeSelect.value);
        });

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            
            const data = {
                title: document.getElementById('title').value,
                media_type: document.getElementById('media-type').value,
                genre: document.getElementById('genre').value,
                notes: document.getElementById('notes').value,
            };

            const scores = {};

            const categories = scoringProfiles[data.media_type];

            categories.forEach(category => {
                const slider = document.getElementById(category);
                scores[category] = Number(slider.value);
            });

            data.scores = scores;

            const response = await fetch("http://127.0.0.1:8000/entries/", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(data)
            });

            const result = await response.json();
            
            console.log(result);

            await loadEntries();
        });

        async function loadEntries() {
            const response = await fetch("http://127.0.0.1:8000/entries/");
            const entries = await response.json();

            const container = document.getElementById('entries-container');
            container.innerHTML = '';

            entries.forEach(entry => {
                const div = document.createElement('div');

                const percentScore = ((entry.total_score / 5) * 100).toFixed(0);

                div.innerHTML = `
                    <h3>${entry.title}</h3>

                    <p><strong>Date:</strong> ${entry.date_consumed || "N/A"}</p>
                    <p><strong>Type:</strong> ${entry.media_type}</p>
                    <p><strong>Genre:</strong> ${entry.genre}</p>

                    <p><strong>Scores:</strong></p>
                    <ul>
                        ${Object.entries(entry.scores || {}).map(([k, v]) =>
                            `<li>${k}: ${v}</li>`
                        ).join('')}
                    </ul>

                    <p><strong>Total Score:</strong> ${entry.total_score.toFixed(2)} / 5 (${percentScore}%)</p>

                    <p><strong>Notes:</strong> ${entry.notes}</p>
                    <hr>
                `;

                container.appendChild(div);
            })
        }

        loadEntries();
    </script>

</body>

</html>
