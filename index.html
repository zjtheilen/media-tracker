<! DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <title>Media Tracker</title>
</head>

<body>

    <h1>Media Tracker</h1>
    <p>Welcome to the Media Tracker!</p>

    <button id="openBtn">Add an Entry</button>
    <dialog id="entryModal">

        <form id="entry-form">
            <input type="text" id="title" placeholder="Title" required>

            <select id="media-type">
                <option value="video">video</option>
                <option value="game">game</option>
                <option value="book">book</option>
            </select>

            <input type="text" id="genre" placeholder="Genre">

            <textarea id="notes" placeholder="Notes"></textarea>

            <div id="score-container"></div>

            <div class="row" style="display: flex;">
                <button type="submit" style="width: 50%; margin: 5px;">Add Entry</button>
                <button id="closeBtn" style="width: 50%; margin: 5px;">Close</button>
            </div>
            
        </form>
    </dialog>

    <h2>Entries</h2>

    <div id="entries-container"></div>

</body>

</html>
